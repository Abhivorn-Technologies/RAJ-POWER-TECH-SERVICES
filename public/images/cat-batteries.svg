<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" fill="none">
  <defs>
    <linearGradient id="batBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142B55"/>
      <stop offset="100%" stop-color="#081426"/>
    </linearGradient>
    <linearGradient id="casingG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D3B52"/>
      <stop offset="100%" stop-color="#192334"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" rx="20" fill="url(#batBg)"/>
  
  <!-- Subtle Grid -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <path d="M0 75H600 M0 150H600 M0 225H600 M0 300H600 M0 375H600" />
    <path d="M100 0V450 M200 0V450 M300 0V450 M400 0V450 M500 0V450" />
  </g>

  <!-- Glowing Backdrop -->
  <circle cx="300" cy="225" r="140" fill="#142B55" opacity="0.4"/>
  <circle cx="300" cy="225" r="90" fill="#D52B30" opacity="0.15"/>

  <!-- Battery Main Container -->
  <rect x="160" y="110" width="280" height="235" rx="14" fill="url(#casingG)" stroke="#3E5275" stroke-width="2"/>
  
  <!-- Battery Top Cover Lid -->
  <rect x="150" y="95" width="300" height="30" rx="8" fill="#D52B30"/>
  
  <!-- Terminals -->
  <rect x="180" y="80" width="26" height="15" rx="3" fill="#E2E8F0"/>
  <rect x="188" y="72" width="10" height="8" rx="2" fill="#94A3B8"/>
  <text x="193" y="115" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="900">+</text>
  
  <rect x="394" y="80" width="26" height="15" rx="3" fill="#475569"/>
  <rect x="402" y="72" width="10" height="8" rx="2" fill="#334155"/>
  <text x="407" y="115" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="900">−</text>

  <!-- 6 Vent Plugs with Level Indicators -->
  <g fill="#FFFFFF">
    <circle cx="230" cy="110" r="7"/>
    <circle cx="260" cy="110" r="7"/>
    <circle cx="290" cy="110" r="7"/>
    <circle cx="320" cy="110" r="7"/>
    <circle cx="350" cy="110" r="7"/>
    <circle cx="380" cy="110" r="7"/>
  </g>
  <g fill="#10B981">
    <circle cx="230" cy="110" r="3"/>
    <circle cx="260" cy="110" r="3"/>
    <circle cx="290" cy="110" r="3"/>
    <circle cx="320" cy="110" r="3"/>
    <circle cx="350" cy="110" r="3"/>
    <circle cx="380" cy="110" r="3"/>
  </g>

  <!-- Ribbed Heavy Duty Front Pattern -->
  <g stroke="#16202F" stroke-width="3">
    <line x1="185" y1="145" x2="185" y2="325"/>
    <line x1="210" y1="145" x2="210" y2="325"/>
    <line x1="235" y1="145" x2="235" y2="325"/>
    <line x1="260" y1="145" x2="260" y2="325"/>
    <line x1="285" y1="145" x2="285" y2="325"/>
    <line x1="315" y1="145" x2="315" y2="325"/>
    <line x1="340" y1="145" x2="340" y2="325"/>
    <line x1="365" y1="145" x2="365" y2="325"/>
    <line x1="390" y1="145" x2="390" y2="325"/>
    <line x1="415" y1="145" x2="415" y2="325"/>
  </g>

  <!-- Central Heavy Badge -->
  <rect x="200" y="195" width="200" height="75" rx="8" fill="#111A29" stroke="#3E5275" stroke-width="1.5"/>
  <text x="300" y="222" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="900" letter-spacing="0.1em">TALL TUBULAR</text>
  <text x="300" y="242" text-anchor="middle" fill="#D52B30" font-family="sans-serif" font-size="12" font-weight="700">HEAVY-DUTY CYCLE</text>
  <text x="300" y="258" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="10">DEEP DISCHARGE ENDURANCE</text>

  <!-- Bottom Badge -->
  <rect x="200" y="365" width="200" height="36" rx="18" fill="#142B55" stroke="#D52B30" stroke-width="1.5"/>
  <text x="300" y="388" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700" letter-spacing="0.05em">INVERTER BATTERIES</text>
</svg>
