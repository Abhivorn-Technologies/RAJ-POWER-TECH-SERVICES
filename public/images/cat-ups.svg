<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" fill="none">
  <defs>
    <linearGradient id="upsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142B55"/>
      <stop offset="100%" stop-color="#081323"/>
    </linearGradient>
    <linearGradient id="towerG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1C273A"/>
      <stop offset="100%" stop-color="#283750"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" rx="20" fill="url(#upsBg)"/>

  <!-- Grid lines -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <path d="M0 75H600 M0 150H600 M0 225H600 M0 300H600 M0 375H600" />
    <path d="M100 0V450 M200 0V450 M300 0V450 M400 0V450 M500 0V450" />
  </g>

  <!-- Glowing Aura -->
  <circle cx="300" cy="225" r="130" fill="#0284C7" opacity="0.15"/>
  <circle cx="300" cy="225" r="90" fill="#D52B30" opacity="0.12"/>

  <!-- UPS Tower Casing -->
  <rect x="210" y="80" width="180" height="270" rx="14" fill="url(#towerG)" stroke="#3E5275" stroke-width="2"/>
  
  <!-- Sleek Red Vertical Accent Stripe -->
  <rect x="225" y="95" width="4" height="240" rx="2" fill="#D52B30"/>

  <!-- Tower Front Display Panel -->
  <rect x="245" y="105" width="125" height="85" rx="8" fill="#0C1420" stroke="#1F2E45" stroke-width="1.5"/>
  <text x="307" y="126" text-anchor="middle" fill="#00E5FF" font-family="monospace" font-size="16" font-weight="bold">230 V</text>
  <text x="307" y="142" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-size="9">OUTPUT VOLTAGE</text>

  <!-- Battery Level Bar Gauge -->
  <g fill="#10B981">
    <rect x="260" y="156" width="16" height="8" rx="1"/>
    <rect x="280" y="156" width="16" height="8" rx="1"/>
    <rect x="300" y="156" width="16" height="8" rx="1"/>
    <rect x="320" y="156" width="16" height="8" rx="1"/>
    <rect x="340" y="156" width="16" height="8" rx="1"/>
  </g>
  <text x="307" y="177" text-anchor="middle" fill="#10B981" font-family="sans-serif" font-size="8" font-weight="bold">LOAD: 48% • ONLINE</text>

  <!-- Power Push Switch -->
  <circle cx="307" cy="225" r="16" fill="#142B55" stroke="#D52B30" stroke-width="2"/>
  <path d="M307 217V223 M302 220A7 7 0 1 0 312 220" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

  <!-- Ventilation Slots -->
  <g fill="#111B29">
    <rect x="245" y="260" width="125" height="5" rx="2"/>
    <rect x="245" y="272" width="125" height="5" rx="2"/>
    <rect x="245" y="284" width="125" height="5" rx="2"/>
    <rect x="245" y="296" width="125" height="5" rx="2"/>
    <rect x="245" y="308" width="125" height="5" rx="2"/>
    <rect x="245" y="320" width="125" height="5" rx="2"/>
  </g>

  <!-- Bottom Category Tag -->
  <rect x="200" y="370" width="200" height="36" rx="18" fill="#142B55" stroke="#D52B30" stroke-width="1.5"/>
  <text x="300" y="393" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700" letter-spacing="0.05em">ONLINE &amp; LINE-UPS</text>
</svg>
