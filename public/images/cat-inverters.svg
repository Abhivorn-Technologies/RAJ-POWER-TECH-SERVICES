<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" fill="none">
  <defs>
    <linearGradient id="invBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142B55"/>
      <stop offset="100%" stop-color="#0B1A35"/>
    </linearGradient>
    <linearGradient id="accentG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D52B30"/>
      <stop offset="100%" stop-color="#FF5A5F"/>
    </linearGradient>
    <linearGradient id="bodyG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2A3850"/>
      <stop offset="100%" stop-color="#182335"/>
    </linearGradient>
  </defs>

  <!-- Background Card Canvas -->
  <rect width="600" height="450" rx="20" fill="url(#invBg)"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <path d="M0 75H600 M0 150H600 M0 225H600 M0 300H600 M0 375H600" />
    <path d="M100 0V450 M200 0V450 M300 0V450 M400 0V450 M500 0V450" />
  </g>

  <!-- Glowing Aura -->
  <circle cx="300" cy="225" r="140" fill="#D52B30" opacity="0.12" filter="blur(40px)"/>

  <!-- Inverter Outer Chassis -->
  <rect x="120" y="110" width="360" height="230" rx="16" fill="url(#bodyG)" stroke="#3E5275" stroke-width="2"/>
  
  <!-- Front Bezel -->
  <rect x="135" y="125" width="330" height="200" rx="10" fill="#111B2C"/>

  <!-- Top Accent Bar -->
  <rect x="135" y="125" width="330" height="8" rx="4" fill="url(#accentG)"/>

  <!-- LCD Screen Display -->
  <rect x="165" y="155" width="160" height="90" rx="8" fill="#060C16" stroke="#1E2E48" stroke-width="2"/>
  
  <!-- Sine Wave Graphic on Display -->
  <path d="M180 200 Q195 175 210 200 T240 200 T270 200 T300 200" fill="none" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round"/>
  <text x="180" y="178" fill="#00E5FF" font-family="monospace" font-size="11" font-weight="bold">OUTPUT: 230V PURE SINE</text>
  <text x="180" y="232" fill="#10B981" font-family="monospace" font-size="10">STATUS: MAINS ON • 100%</text>

  <!-- Status LED Cluster -->
  <circle cx="370" cy="170" r="5" fill="#10B981"/>
  <text x="385" y="174" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">Mains Normal</text>
  
  <circle cx="370" cy="195" r="5" fill="#00E5FF"/>
  <text x="385" y="199" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">ECO Mode Active</text>
  
  <circle cx="370" cy="220" r="5" fill="#D52B30"/>
  <text x="385" y="224" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">Smart Protection</text>

  <!-- Ventilation Grille -->
  <g fill="#1F2E47">
    <rect x="165" y="265" width="270" height="4" rx="2"/>
    <rect x="165" y="275" width="270" height="4" rx="2"/>
    <rect x="165" y="285" width="270" height="4" rx="2"/>
    <rect x="165" y="295" width="270" height="4" rx="2"/>
  </g>

  <!-- Power Switch Button -->
  <rect x="410" y="155" width="25" height="40" rx="4" fill="#D52B30"/>
  <line x1="422" y1="165" x2="422" y2="185" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

  <!-- Badge Pill -->
  <rect x="200" y="360" width="200" height="36" rx="18" fill="#142B55" stroke="#D52B30" stroke-width="1.5"/>
  <text x="300" y="383" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700" letter-spacing="0.05em">PURE SINE WAVE SERIES</text>
</svg>
