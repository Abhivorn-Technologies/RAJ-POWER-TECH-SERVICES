  <rect x="70" y="65" width="260" height="160" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
  <rect x="70" y="65" width="260" height="8" rx="4" fill="#D52B30"/>
  
  <!-- Digital Meter -->
