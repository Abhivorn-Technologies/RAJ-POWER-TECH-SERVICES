<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" fill="none">
  <rect width="400" height="300" rx="12" fill="#F8FAFC"/>
  <rect x="1" y="1" width="398" height="298" rx="11" stroke="#E2E8F0"/>
  <circle cx="200" cy="150" r="100" fill="#142B55" opacity="0.04"/>

  <!-- Battery Body (Extra Tall) -->
  <rect x="95" y="60" width="210" height="185" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
  
  <!-- Red Top Lid -->
  <rect x="90" y="50" width="220" height="24" rx="5" fill="#D52B30"/>
  
  <!-- Terminals -->
  <rect x="110" y="38" width="20" height="14" rx="2" fill="#E2E8F0"/>
  <rect x="270" y="38" width="20" height="14" rx="2" fill="#475569"/>

  <!-- Float indicators -->
  <circle cx="145" cy="62" r="5" fill="#FFFFFF"/>
  <circle cx="170" cy="62" r="5" fill="#FFFFFF"/>
  <circle cx="195" cy="62" r="5" fill="#FFFFFF"/>
  <circle cx="220" cy="62" r="5" fill="#FFFFFF"/>
  <circle cx="245" cy="62" r="5" fill="#FFFFFF"/>
  <circle cx="270" cy="62" r="5" fill="#FFFFFF"/>

  <!-- Center Label -->
  <rect x="125" y="115" width="150" height="75" rx="6" fill="#1E293B" stroke="#334155"/>
  <text x="200" y="140" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="900">220 Ah</text>
  <text x="200" y="160" text-anchor="middle" fill="#D52B30" font-family="sans-serif" font-size="10" font-weight="bold">EXTENDED RESERVE 12V</text>
  <text x="200" y="176" text-anchor="middle" fill="#38BDF8" font-family="sans-serif" font-size="9">COMMERCIAL &amp; LARGE HOME</text>

  <!-- Bottom Tag -->
  <rect x="130" y="255" width="140" height="24" rx="12" fill="#142B55"/>
  <text x="200" y="271" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="bold">TUBULAR 220Ah</text>
</svg>
