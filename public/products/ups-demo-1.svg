<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" fill="none">
  <rect width="400" height="300" rx="12" fill="#F8FAFC"/>
  <rect x="1" y="1" width="398" height="298" rx="11" stroke="#E2E8F0"/>
  <circle cx="200" cy="150" r="100" fill="#142B55" opacity="0.04"/>

  <!-- UPS Tower Body -->
  <rect x="145" y="55" width="110" height="190" rx="8" fill="#1E293B" stroke="#0F172A" stroke-width="2"/>
  <rect x="150" y="65" width="4" height="170" rx="2" fill="#D52B30"/>

  <!-- Screen -->
  <rect x="165" y="75" width="75" height="55" rx="5" fill="#020617" stroke="#334155"/>
  <text x="202" y="94" text-anchor="middle" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold">1000 VA</text>
  <text x="202" y="108" text-anchor="middle" fill="#4ADE80" font-family="monospace" font-size="8">AVR ACTIVE</text>
  <text x="202" y="120" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="7">230V STABLE</text>

  <!-- Power Button -->
  <circle cx="202" cy="150" r="12" fill="#0F172A" stroke="#D52B30" stroke-width="1.5"/>
  <path d="M202 144V149 M198 147A5 5 0 1 0 206 147" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Air vents -->
  <line x1="165" y1="175" x2="240" y2="175" stroke="#334155" stroke-width="1.5"/>
  <line x1="165" y1="183" x2="240" y2="183" stroke="#334155" stroke-width="1.5"/>
  <line x1="165" y1="191" x2="240" y2="191" stroke="#334155" stroke-width="1.5"/>
  <line x1="165" y1="199" x2="240" y2="199" stroke="#334155" stroke-width="1.5"/>
  <line x1="165" y1="207" x2="240" y2="207" stroke="#334155" stroke-width="1.5"/>

  <!-- Bottom Tag -->
  <rect x="130" y="255" width="140" height="24" rx="12" fill="#142B55"/>
  <text x="200" y="271" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="bold">LINE-UPS 1000VA</text>
</svg>
