<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" fill="none">
  <rect width="400" height="300" rx="12" fill="#F8FAFC"/>
  <rect x="1" y="1" width="398" height="298" rx="11" stroke="#E2E8F0"/>
  <circle cx="200" cy="150" r="100" fill="#142B55" opacity="0.04"/>

  <!-- Battery Body -->
  <rect x="100" y="65" width="200" height="175" rx="10" fill="#1E293B" stroke="#0F172A" stroke-width="2"/>
  
  <!-- Red Top Lid -->
  <rect x="95" y="55" width="210" height="22" rx="5" fill="#D52B30"/>
  
  <!-- Terminals -->
  <rect x="115" y="42" width="18" height="14" rx="2" fill="#E2E8F0"/>
  <rect x="267" y="42" width="18" height="14" rx="2" fill="#475569"/>

  <!-- Floats -->
  <circle cx="150" cy="66" r="4" fill="#FFFFFF"/>
  <circle cx="170" cy="66" r="4" fill="#FFFFFF"/>
  <circle cx="190" cy="66" r="4" fill="#FFFFFF"/>
  <circle cx="210" cy="66" r="4" fill="#FFFFFF"/>
  <circle cx="230" cy="66" r="4" fill="#FFFFFF"/>
  <circle cx="250" cy="66" r="4" fill="#FFFFFF"/>

  <!-- Ribs -->
  <line x1="120" y1="95" x2="120" y2="225" stroke="#0F172A" stroke-width="2"/>
  <line x1="140" y1="95" x2="140" y2="225" stroke="#0F172A" stroke-width="2"/>
  <line x1="160" y1="95" x2="160" y2="225" stroke="#0F172A" stroke-width="2"/>
  <line x1="240" y1="95" x2="240" y2="225" stroke="#0F172A" stroke-width="2"/>
  <line x1="260" y1="95" x2="260" y2="225" stroke="#0F172A" stroke-width="2"/>
  <line x1="280" y1="95" x2="280" y2="225" stroke="#0F172A" stroke-width="2"/>

  <!-- Center Label -->
  <rect x="130" y="125" width="140" height="65" rx="6" fill="#0F172A" stroke="#334155"/>
  <text x="200" y="148" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="900">150 Ah</text>
  <text x="200" y="166" text-anchor="middle" fill="#D52B30" font-family="sans-serif" font-size="9" font-weight="bold">TALL TUBULAR 12V</text>
  <text x="200" y="180" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-size="8">HIGH CYCLIC LIFE</text>

  <!-- Bottom Tag -->
  <rect x="130" y="250" width="140" height="24" rx="12" fill="#142B55"/>
  <text x="200" y="266" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="bold">TUBULAR 150Ah</text>
</svg>
